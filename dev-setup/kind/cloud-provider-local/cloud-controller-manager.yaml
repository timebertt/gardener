apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: kubernetes
    role: cloud-controller-manager
  name: cloud-controller-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: kubernetes
    role: cloud-controller-manager
  name: system:cloud-controller-manager
# TODO(timebertt): use a more restrictive role instead of cluster-admin
# The cloud-controller-manager ServiceAccount is only used for requesting tokens for the controller-specific
# ServiceAccounts (like in kube-controller-manager), so it shouldn't need cluster-admin privileges.
# Gardener provider extensions typically provision cloud-controller-manager with cluster-admin as well, so this should
# be fine for our local setup for now.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: cloud-controller-manager
  namespace: kube-system
---
