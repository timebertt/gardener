---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kubernetes
    role: cloud-controller-manager
  name: cloud-controller-manager
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: kubernetes
      role: cloud-controller-manager
  template:
    metadata:
      labels:
        app: kubernetes
        role: cloud-controller-manager
    spec:
      serviceAccountName: cloud-controller-manager
      priorityClassName: system-cluster-critical
      containers:
      - name: cloud-controller-manager
        image: local-skaffold/cloud-controller-manager-local
        imagePullPolicy: IfNotPresent
        args:
#        - --kubeconfig=/var/run/secrets/gardener.cloud/shoot/generic-kubeconfig/kubeconfig
#        - --authentication-kubeconfig=/var/run/secrets/gardener.cloud/shoot/generic-kubeconfig/kubeconfig
#        - --authorization-kubeconfig=/var/run/secrets/gardener.cloud/shoot/generic-kubeconfig/kubeconfig
        - --use-service-account-credentials
        - --cloud-provider=local
        - --webhook-secure-port=0
        - --leader-elect=true
        - --leader-elect-resource-name=cloud-controller-manager
#        - --concurrent-service-syncs=3
        - --authorization-always-allow-paths=/metrics
        - --cloud-config=/etc/config/config.yaml
        # TODO(timebertt): inject kind cluster name
        - --cluster-name=gardener-operator-local
#        - --metrics-address=:9090
        - --controllers=service
        # TODO(timebertt): add health port and probes
#        ports:
#        - containerPort: 4443
#          name: https
#          protocol: TCP
#        livenessProbe:
#          failureThreshold: 3
#          httpGet:
#            path: /livez
#            port: https
#            scheme: HTTPS
#          periodSeconds: 10
#        readinessProbe:
#          failureThreshold: 3
#          httpGet:
#            path: /readyz
#            port: https
#            scheme: HTTPS
#          initialDelaySeconds: 20
#          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: config
          mountPath: /etc/config
      volumes:
      - name: config
        configMap:
          defaultMode: 420
          name: cloud-controller-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: kubernetes
    role: cloud-controller-manager
  name: cloud-controller-manager
  namespace: kube-system
data:
  config.yaml: |
    apiVersion: cloudprovider.local.gardener.cloud/v1alpha1
    kind: CloudProviderConfiguration
